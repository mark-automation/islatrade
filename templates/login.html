{% extends "base.html" %}
{% block title %}Supplier Login — IslaTrade{% endblock %}
{% block content %}
<div class="wrap" style="max-width:460px;margin:48px auto">
 <div class="card" style="padding:28px">
  <h1 style="margin-top:0">Supplier Login</h1>
  {% if err %}<p style="color:#c0392b">{{ err }}</p>{% endif %}
  <form method="post" action="/login">
   <label>Email<br><input name="email" type="email" required style="width:100%;padding:10px;margin:6px 0 14px"></label>
   <label>Password<br><input name="pw" type="password" required style="width:100%;padding:10px;margin:6px 0 14px"></label>
   <button style="width:100%;padding:12px;background:#0a6ebd;color:#fff;border:0;border-radius:8px;font-size:16px">Log in</button>
  </form>
  <p style="margin-top:18px;font-size:14px">No account yet? <a href="/register">Register as a supplier</a></p>
  <p style="font-size:13px;color:#777">Demo account: demo@islatrade.ph / islatrade</p>
 </div>
</div>
{% endblock %}
