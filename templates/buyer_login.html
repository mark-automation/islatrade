{% extends "base.html" %}
{% block title %}Buyer log in — IslaTrade{% endblock %}
{% block content %}
<div class="wrap"><div class="panel authcard">
 <h2>Buyer log in</h2>
 <p class="muted">Access your inquiries, quotes and orders.</p>
 {% if err %}<p class="form-err">{{ err }}</p>{% endif %}
 <form method="post" action="/buyer/login">
  <label>Email<input class="f" name="email" type="email" required></label>
  <label>Password<input class="f" name="pw" type="password" required></label>
  <button class="btn wide-btn">Log in</button>
 </form>
 <p class="muted alt-auth">No account yet? <a href="/buyer/register">Sign up free</a></p>
</div></div>
{% endblock %}
